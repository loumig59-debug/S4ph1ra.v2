<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin — S4ph1ra</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="adminApp" class="admin-shell hidden">
<aside class="admin-sidebar"><a class="brand" href="index.html">✦ S4ph1ra</a><button class="admin-nav active" data-section="dashboard">📊 Tableau de bord</button><button class="admin-nav" data-section="artworks">🎨 Dessins</button><button class="admin-nav" data-section="categories">📁 Catégories</button><button class="admin-nav" data-section="users">👥 Utilisateurs</button><button class="admin-nav" data-section="comments">💬 Commentaires</button><button class="admin-nav" data-section="reports">🚩 Signalements</button><button class="admin-nav" data-section="news">📰 Actualités</button><button class="admin-nav" data-section="goals">🎯 Objectifs</button><button class="admin-nav" data-section="appearance">🎨 Apparence</button><button class="admin-nav" data-section="settings">⚙️ Paramètres</button><a class="admin-nav" href="index.html">↩ Site</a></aside>
<main class="admin-main"><div class="admin-top"><h1 id="adminTitle">Tableau de bord</h1><span id="adminUser"></span></div>
<section id="dashboard" class="admin-section active"><div class="stat-cards" id="adminStats"></div><div class="panel"><h2>Activité récente</h2><div id="recentActivity"></div></div></section>
<section id="artworks" class="admin-section"><div class="panel"><h2>Ajouter / modifier un dessin</h2><form id="artForm" class="form-grid"><input type="hidden" id="artId"><input id="artTitle" class="input" placeholder="Titre" required><textarea id="artDescription" class="input" placeholder="Description"></textarea><input id="artTags" class="input" placeholder="Tags séparés par des virgules"><select id="artCategory" class="input" required></select><label>Image principale <input id="artImageUrl" class="input" type="url" placeholder="URL de l’image principale" required></label><label>Étapes (facultatif, plusieurs images)<textarea id="artStepsUrls" class="input" rows="4" placeholder="URLs des étapes, une par ligne"></textarea></label><label class="check"><input id="artFeatured" type="checkbox"> Mise en avant</label><label class="check"><input id="artComments" type="checkbox" checked> Commentaires activés</label><button class="btn primary" type="submit">Publier</button><button class="btn ghost" type="button" id="resetArt">Annuler</button></form></div><div class="panel"><h2>Créations</h2><div id="adminArtworks"></div></div></section>
<section id="categories" class="admin-section"><div class="panel"><h2>Catégories</h2><form id="categoryForm" class="inline-form"><input id="categoryName" class="input" placeholder="Nom" required><input id="categoryDesc" class="input" placeholder="Description"><button class="btn primary">Ajouter</button></form><div id="adminCategories"></div></div></section>
<section id="users" class="admin-section"><div class="panel"><h2>Utilisateurs</h2><div id="adminUsers"></div></div></section>
<section id="comments" class="admin-section"><div class="panel"><h2>Commentaires</h2><div id="adminComments"></div></div></section>
<section id="reports" class="admin-section"><div class="panel"><h2>Signalements</h2><div id="adminReports"></div></div></section>
<section id="news" class="admin-section"><div class="panel"><h2>Nouvelle actualité</h2><form id="newsForm" class="form-grid"><input id="newsTitle" class="input" placeholder="Titre" required><textarea id="newsText" class="input" placeholder="Texte"></textarea><button class="btn primary">Publier</button></form></div><div class="panel"><div id="adminNews"></div></div></section>
<section id="goals" class="admin-section"><div class="panel"><h2>Objectifs</h2><form id="goalForm" class="inline-form"><input id="goalText" class="input" placeholder="Nouvel objectif" required><button class="btn primary">Ajouter</button></form><div id="adminGoals"></div></div></section>
<section id="appearance" class="admin-section"><div class="panel"><h2>Apparence</h2><form id="appearanceForm" class="form-grid"><input id="siteSymbol" class="input" placeholder="Symbole (emoji ou texte court)"><input id="siteAccent" class="input" type="color" value="#9b7cff"><input id="siteHeroTitle" class="input" placeholder="Titre accueil"><textarea id="siteHeroText" class="input" placeholder="Texte accueil"></textarea><input id="siteHeroImageUrl" class="input" type="url" placeholder="URL de l’image d’accueil"><input id="siteFaviconUrl" class="input" type="url" placeholder="URL du favicon (icône d’onglet du navigateur)"><label class="check"><input id="animationsEnabled" type="checkbox" checked> Animations</label><button class="btn primary">Enregistrer</button></form></div></section>
<section id="settings" class="admin-section"><div class="panel"><h2>Paramètres</h2><form id="settingsForm" class="form-grid"><input id="siteEmail" class="input" type="email" placeholder="Email affiché"><input id="instagram" class="input" placeholder="Instagram URL"><input id="tiktok" class="input" placeholder="TikTok URL"><input id="youtube" class="input" placeholder="YouTube URL"><input id="siteAnnouncement" class="input" placeholder="Annonce globale"><label class="check"><input id="maintenance" type="checkbox"> Mode maintenance</label><button class="btn primary">Enregistrer</button></form></div></section>
</main></div>
<div id="adminDenied" class="center-page hidden"><main class="auth-card"><h1>Accès refusé</h1><p>Ton compte n'a pas le rôle requis pour accéder à l'administration.</p><a href="index.html" class="btn primary">Retour</a></main></div>
<script type="module" src="admin.js"></script></body></html>
